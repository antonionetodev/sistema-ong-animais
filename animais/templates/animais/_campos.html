{% if form.non_field_errors %}
<div class="alert alert-danger">{% for e in form.non_field_errors %}{{ e }}<br>{% endfor %}</div>
{% endif %}
<div class="row g-3">
{% for field in form %}
    <div class="{% if field.field.widget.input_type == 'textarea' or field.name in largos %}col-12{% else %}col-md-6{% endif %}" id="campo-{{ field.name }}">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
        {{ field }}
        {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
        {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
    </div>
{% endfor %}
</div>
