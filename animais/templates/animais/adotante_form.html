{% extends 'painel/base.html' %}
{% block titulo %}Adotante{% endblock %}
{% block conteudo %}
<h1 class="h3 mb-4">{% if adotante %}Editar {{ adotante.nome }}{% else %}Novo adotante{% endif %}</h1>
<form method="post" class="card card-body shadow-sm">
    {% csrf_token %}
    {% include 'animais/_campos.html' %}
    <div class="mt-4 d-flex gap-2">
        <button class="btn btn-success">Salvar</button>
        <a href="{% url 'adotante_lista' %}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
