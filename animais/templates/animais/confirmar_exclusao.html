{% extends 'painel/base.html' %}
{% block titulo %}Confirmar exclusão{% endblock %}
{% block conteudo %}
<div class="card shadow-sm mx-auto" style="max-width: 520px;">
    <div class="card-body">
        <h1 class="h5">Excluir "{{ objeto }}"?</h1>
        <p class="text-muted">Essa ação não pode ser desfeita.{% if aviso %} {{ aviso }}{% endif %}</p>
        <form method="post" class="d-flex gap-2">
            {% csrf_token %}
            <button class="btn btn-danger">Sim, excluir</button>
            <a href="{% url voltar.0 voltar.1 %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
