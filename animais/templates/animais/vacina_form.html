{% extends 'painel/base.html' %}
{% block titulo %}Dose · {{ animal.nome }}{% endblock %}
{% block conteudo %}
<h1 class="h3 mb-4">{% if vacina %}Editar dose{% else %}Registrar dose{% endif %} · {{ animal.nome }}</h1>
<form method="post" class="card card-body shadow-sm">
    {% csrf_token %}
    {% include 'animais/_campos.html' %}
    <div class="mt-4 d-flex gap-2">
        <button class="btn btn-success">Salvar</button>
        <a href="{% url 'detalhe_animal' animal.id %}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
