<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Painel{% endblock %} · Peludinhos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-numero { font-size: 2rem; font-weight: 700; line-height: 1; }
        .card-rotulo { font-size: .85rem; color: #6c757d; text-transform: uppercase; letter-spacing: .03em; }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-md navbar-dark bg-success mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}">🐾 Peludinhos</a>
        {% if user.is_authenticated %}
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">Painel</a></li>
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name in 'lista_animais detalhe_animal animal_novo animal_editar animal_excluir vacina_nova vacina_editar vacina_excluir anexo_novo anexo_excluir' %}active{% endif %}" href="{% url 'lista_animais' %}">Animais</a></li>
                <li class="nav-item"><a class="nav-link {% if 'adocao' in request.resolver_match.url_name or 'adotante' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'adocao_lista' %}">Adoções</a></li>
                <li class="nav-item"><a class="nav-link {% if 'atendimento' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'atendimento_lista' %}">Atendimentos</a></li>
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'avisos' %}active{% endif %}" href="{% url 'avisos' %}">Avisos</a></li>
            </ul>
            <span class="navbar-text me-3">Olá, {{ user.first_name|default:user.username }}</span>
            <form method="post" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button class="btn btn-outline-light btn-sm">Sair</button>
            </form>
        </div>
        {% endif %}
    </div>
</nav>

<main class="container pb-5">
    {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% block conteudo %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
